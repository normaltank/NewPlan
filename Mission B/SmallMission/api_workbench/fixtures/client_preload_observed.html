</div><script>
(function() {
    var PAGE_SIZE = 16;
    var allCards = [];
    var currentPage = 1;
    var totalPages = 1;

    function getPageFromHash() {
        var m = window.location.hash.match(/page=(\d+)/);
        return m ? parseInt(m[1], 10) : 1;
    }

    function updateHash(page) {
        var url = window.location.pathname + window.location.search;
        if (page > 1) url += '#page=' + page;
        history.replaceState(null, '', url);
    }

    /* 蓝色在前、黑色在后，合并成一个连续数组 */
    function buildAllCards() {
        var source = document.getElementById('prof-source');
        if (!source) return;
        var hasCards = Array.prototype.slice.call(source.querySelectorAll('.prof-card-has'));
        var noCards  = Array.prototype.slice.call(source.querySelectorAll('.prof-card-no'));
        allCards = hasCards.concat(noCards);
        totalPages = Math.ceil(allCards.length / PAGE_SIZE) || 1;
    }

    function renderPage(page) {
        if (page < 1) page = 1;
        if (page > totalPages) page = totalPages;
        currentPage = page;

        var grid = document.getElementById('prof-grid');
        while (grid.firstChild) grid.removeChild(grid.firstChild);

        var start = (page - 1) * PAGE_SIZE;
        var end   = Math.min(start + PAGE_SIZE, allCards.length);

        for (var i = start; i < end; i++) {
            grid.appendChild(allCards[i].cloneNode(true));
        }

        updateHash(page);
        renderPager();
    }

    function renderPager() {
        var pager = document.getElementById('prof-pager');
        if (!pager) return;
        pager.innerHTML = '';
        if (totalPages <= 1) return;

        var li = document.createElement('li');
        li.className = 'page_nav';
        li.innerHTML = buildPageButtons(currentPage, totalPages);
        pager.appendChild(li);

        li.addEventListener('click', function(e) {
            var target = e.target.closest('[data-page]');
            if (!target) return;
            e.preventDefault();
            var p = parseInt(target.getAttribute('data-page'), 10);
            if (p >= 1 && p <= totalPages && p !== currentPage) {
                renderPage(p);
                var top = document.querySelector('.page-layout').getBoundingClientRect().top + window.pageYOffset - 20;
                window.scrollTo({ top: top, behavior: 'smooth' });
            }
        });
    }

    function buildPageButtons(current, total) {
        var html = '';

        html += current === 1
            ? '<span class="p_prev_d p_fun_d">首页</span>'
            : '<span class="p_prev_d p_fun"><a href="javascript:;" target="_self" data-page="1">首页</a></span>';

        html += current === 1
            ? '<span class="p_prev_d p_fun_d">上页</span>'
            : '<span class="p_prev_d p_fun"><a href="javascript:;" target="_self" data-page="' + (current - 1) + '">上页</a></span>';

        var start = Math.max(1, current - 3);
        var end   = Math.min(total, start + 6);
        if (end - start < 6) start = Math.max(1, end - 6);

        if (start > 1) {
            html += '<span class="p_no"><a href="javascript:;" target="_self" data-page="1">1</a></span>';
            if (start > 2) html += '<span class="p_dot">...</span>';
        }

        for (var i = start; i <= end; i++) {
            html += (i === current)
                ? '<span class="p_no_d">' + i + '</span>'
                : '<span class="p_no"><a href="javascript:;" target="_self" data-page="' + i + '">' + i + '</a></span>';
        }

        if (end < total) {
            if (end < total - 1) html += '<span class="p_dot">...</span>';
            html += '<span class="p_no"><a href="javascript:;" target="_self" data-page="' + total + '">' + total + '</a></span>';
        }

        html += current === total
            ? '<span class="p_next p_fun_d">下页</span>'
            : '<span class="p_next p_fun"><a href="javascript:;" target="_self" data-page="' + (current + 1) + '">下页</a></span>';

        html += current === total
            ? '<span class="p_last p_fun_d">尾页</span>'
            : '<span class="p_last p_fun"><a href="javascript:;" target="_self" data-page="' + total + '">尾页</a></span>';

        return html;
    }

    function init() {
        buildAllCards();
        console.log('[prof] 总卡片数:', allCards.length, '总页数:', totalPages);
        if (allCards.length === 0) return;
        var initPage = getPageFromHash();
        if (initPage > totalPages) initPage = totalPages;
        renderPage(initPage);
    }

    window.addEventListener('hashchange', function() {
        var p = getPageFromHash();
        if (p !== currentPage && p >= 1 && p <= totalPages) {
            renderPage(p);
        }
    });

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
