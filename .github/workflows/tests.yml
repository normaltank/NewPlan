name: Offline regression

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workbench:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      DEEPSEEK_API_KEY: ''
      JINA_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Run offline workbench tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path runs -Force | Out-Null
          python -m unittest discover -s . -p 'test_*.py' -v
      - name: Run standalone Mission C contract tests
        run: python -m unittest discover -s "Mission C/tests" -v
